name: Feature / Task
description: A single, well-scoped engineering task (one task per issue)
title: "[Task]: "
labels: ["task"]
body:
  - type: input
    id: sprint
    attributes:
      label: Sprint
      placeholder: Sprint 1 - Foundation
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One clear sentence.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: related-docs
    attributes:
      label: Related Documents
      placeholder: Links to docs/ files
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
  - type: textarea
    id: deliverables
    attributes:
      label: Expected Deliverables
    validations:
      required: true
